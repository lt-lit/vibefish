name: league-run

# Plays a league (runner/league.py: a list of decks dealt into four-player tables, seats balanced, one Forge game
# per table) in parallel shards, rolls the results up with the calibration scorecard against Playgroup's human
# precon table and (optionally) publishes them into demo-data/ on the current branch.
#
# The league file is an input. runner/precon-league.json is the 91-deck league (25 cycles = 2200 games = 96-100
# per deck; 20 shards of 110 games at two games at a time take about 1.5 hours each, three hours in practice).
# runner/leagues/*.json are small leagues, such as bots-v1, the decks that have a shipped playbook as one table.
#
# Two ways to start a run: Run workflow (the inputs below), or a push to `testing` that changes
# runner/queue/league-run.json, whose fields are the same inputs (a new "requested" value is enough to start the
# same run again). A promotion of `testing` to `main` starts nothing.
on:
  workflow_dispatch:
    inputs:
      league:
        description: "League file (runner/precon-league.json is the 91 precons; runner/leagues/bots-v1.json the four bot decks)"
        default: "runner/precon-league.json"
      cycles:
        description: "Cycles of four rounds (each deck plays four games per cycle, one in every seat)"
        default: "25"
      shards:
        description: "Parallel shard jobs (max 20 on a free plan)"
        default: "20"
      jobs_per_shard:
        description: "Games at a time per shard (a 4-core runner plays two)"
        default: "2"
      seed:
        description: "Base seed (blank = today's date)"
        default: ""
      run_id:
        description: "Run id (blank = <date>-<league>-<forge>-s<seed>)"
        default: ""
      forge_channel:
        description: "Forge build: the pinned release, or the daily-snapshot build below"
        type: choice
        options: [pinned, snapshot]
        default: snapshot
      forge_snapshot_build:
        description: "Snapshot build to pin (FORGE_SNAPSHOT_BUILD); must be in forge/SHA256SUMS to be verified"
        default: "2.0.16-SNAPSHOT-11.10"
      profile:
        description: "AI profile for every seat (blank = Forge's Default)"
        default: ""
      mc:
        description: "Flat Monte Carlo (2.0.16+ builds): off, on, max or lite"
        default: "off"
      playbooks:
        description: "Play every deck that has a shipped playbook (playbook/precons/<id>.json) under it; the other seats stay stock"
        type: boolean
        default: false
      publish:
        description: "Commit rollup, scorecard and league.json into demo-data/ on this branch"
        type: boolean
        default: false
  push:
    branches: [testing]
    paths: [runner/queue/league-run.json]

permissions:
  contents: write

concurrency:
  group: league-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      league: ${{ steps.vals.outputs.league }}
      cycles: ${{ steps.vals.outputs.cycles }}
      shards: ${{ steps.vals.outputs.shards }}
      jobs_per_shard: ${{ steps.vals.outputs.jobs_per_shard }}
      seed: ${{ steps.vals.outputs.seed }}
      run_id: ${{ steps.vals.outputs.run_id }}
      forge_channel: ${{ steps.vals.outputs.forge_channel }}
      snapshot_build: ${{ steps.vals.outputs.snapshot_build }}
      profile: ${{ steps.vals.outputs.profile }}
      mc: ${{ steps.vals.outputs.mc }}
      playbooks: ${{ steps.vals.outputs.playbooks }}
      publish: ${{ steps.vals.outputs.publish }}
      matrix: ${{ steps.vals.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: vals
        env:
          EVENT: ${{ github.event_name }}
          IN_LEAGUE: ${{ inputs.league }}
          IN_CYCLES: ${{ inputs.cycles }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_JOBS_PER_SHARD: ${{ inputs.jobs_per_shard }}
          IN_SEED: ${{ inputs.seed }}
          IN_RUN_ID: ${{ inputs.run_id }}
          IN_FORGE_CHANNEL: ${{ inputs.forge_channel }}
          IN_FORGE_SNAPSHOT_BUILD: ${{ inputs.forge_snapshot_build }}
          IN_PROFILE: ${{ inputs.profile }}
          IN_MC: ${{ inputs.mc }}
          IN_PLAYBOOKS: ${{ inputs.playbooks }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          set -o pipefail   # a refused request fails this step with its message, not the next job with an empty matrix
          python3 -I runner/queue/league_request.py | tee -a "$GITHUB_OUTPUT"
      - name: Schedule
        env:
          LEAGUE: ${{ steps.vals.outputs.league }}
          SEED: ${{ steps.vals.outputs.seed }}
          CYCLES: ${{ steps.vals.outputs.cycles }}
        run: python3 -I runner/league.py schedule --league "$LEAGUE" --seed "$SEED" --cycles "$CYCLES" --show 0

  shard:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.matrix) }}
    env:
      FORGE_CHANNEL: ${{ needs.prep.outputs.forge_channel }}
      FORGE_SNAPSHOT_BUILD: ${{ needs.prep.outputs.snapshot_build }}
      RUN_ID: ${{ needs.prep.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Forge runtime
        uses: actions/cache@v4
        with:
          path: forge/runtime
          key: forge-runtime-${{ runner.os }}-${{ env.FORGE_CHANNEL }}-${{ env.FORGE_SNAPSHOT_BUILD }}-${{ hashFiles('forge/VERSION', 'forge/SHA256SUMS', 'forge/fetch-forge.sh') }}
      - run: forge/fetch-forge.sh
      - name: Play shard ${{ matrix.shard }}
        env:
          LEAGUE: ${{ needs.prep.outputs.league }}
          SEED: ${{ needs.prep.outputs.seed }}
          CYCLES: ${{ needs.prep.outputs.cycles }}
          SHARDS: ${{ needs.prep.outputs.shards }}
          SHARD: ${{ matrix.shard }}
          JOBS: ${{ needs.prep.outputs.jobs_per_shard }}
          MC: ${{ needs.prep.outputs.mc }}
          PROFILE: ${{ needs.prep.outputs.profile }}
          PLAYBOOKS: ${{ needs.prep.outputs.playbooks }}
        run: |
          nproc; free -g | head -2; cat forge/runtime/VIBEFISH_FORGE_VERSION
          EXTRA=()
          if [ -n "$PROFILE" ]; then EXTRA+=(--profile "$PROFILE"); fi
          if [ "$PLAYBOOKS" = true ]; then EXTRA+=(--playbooks); fi
          python3 -I runner/league.py play --league "$LEAGUE" --seed "$SEED" --cycles "$CYCLES" \
            --out "results/$RUN_ID" --runtime forge/runtime --shards "$SHARDS" --shard "$SHARD" -j "$JOBS" \
            --mc "$MC" "${EXTRA[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            results/${{ needs.prep.outputs.run_id }}/shard-${{ matrix.shard }}/
            results/${{ needs.prep.outputs.run_id }}/league.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}-log
          path: results/${{ needs.prep.outputs.run_id }}/shard-${{ matrix.shard }}.log
          retention-days: 30

  rollup:
    needs: [prep, shard]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ needs.prep.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: results/${{ needs.prep.outputs.run_id }}
      - name: Roll up and score
        env:
          LEAGUE: ${{ needs.prep.outputs.league }}
          SEED: ${{ needs.prep.outputs.seed }}
          CYCLES: ${{ needs.prep.outputs.cycles }}
        run: |
          ls "results/$RUN_ID" | head -40
          python3 -I runner/league.py rollup "results/$RUN_ID" --run-id "$RUN_ID" --league "$LEAGUE" --seed "$SEED" --cycles "$CYCLES"
          python3 -I runner/scorecard.py "results/$RUN_ID/rollup.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rollup
          path: |
            results/${{ needs.prep.outputs.run_id }}/rollup.json
            results/${{ needs.prep.outputs.run_id }}/scorecard.json
            results/${{ needs.prep.outputs.run_id }}/league.json
      - name: Publish into demo-data
        if: ${{ needs.prep.outputs.publish == 'true' }}
        env:
          CYCLES: ${{ needs.prep.outputs.cycles }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          runner/publish.sh "results/$RUN_ID" demo-data
          git config user.name "vibefish-runner"
          git config user.email "vibefish-runner@users.noreply.github.com"
          git add demo-data
          git commit -m "demo-data: $RUN_ID (league, $CYCLES cycles)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "$REF_NAME"
          git push origin "HEAD:$REF_NAME"
