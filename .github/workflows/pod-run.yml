name: pod-run

# Plays the benchmark pod in parallel shards, rolls the results up, and (optionally) publishes them
# into demo-data/ on the current branch, which the pages workflow then deploys.
on:
  workflow_dispatch:
    inputs:
      games_per_shard:
        description: "Games per shard (4 shards run in parallel)"
        default: "5"
      seed:
        description: "Base seed (blank = today's date)"
        default: ""
      run_id:
        description: "Run id (blank = date-pod-forge-seed)"
        default: ""
      publish:
        description: "Commit the results into demo-data/ on this branch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pod-run-${{ github.ref }}
  cancel-in-progress: false

env:
  SHARDS: "4"

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      seed: ${{ steps.vals.outputs.seed }}
      run_id: ${{ steps.vals.outputs.run_id }}
      total: ${{ steps.vals.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - id: vals
        run: |
          seed="${{ inputs.seed }}"; [ -n "$seed" ] || seed=$(date -u +%Y%m%d)
          pod=$(jq -r .name runner/benchmark-pod.json)
          forge=$(tr -d '[:space:]' < forge/VERSION)
          run_id="${{ inputs.run_id }}"; [ -n "$run_id" ] || run_id="$(date -u +%Y-%m-%d)-${pod}-${forge}-s${seed}"
          total=$(( ${{ inputs.games_per_shard }} * SHARDS ))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"; echo "run_id=$run_id" >> "$GITHUB_OUTPUT"; echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "run $run_id: $total games, seed $seed"

  shard:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Forge runtime
        uses: actions/cache@v4
        with:
          path: forge/runtime
          key: forge-runtime-${{ runner.os }}-${{ hashFiles('forge/VERSION', 'forge/SHA256SUMS', 'forge/fetch-forge.sh') }}
      - run: forge/fetch-forge.sh
      - name: Play shard ${{ matrix.shard }}
        run: |
          runner/run-pod.sh -n "${{ needs.prep.outputs.total }}" -j "$SHARDS" -k "${{ matrix.shard }}" \
            -s "${{ needs.prep.outputs.seed }}" -o results -i "${{ needs.prep.outputs.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            results/${{ needs.prep.outputs.run_id }}/shard-${{ matrix.shard }}/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}-log
          path: results/${{ needs.prep.outputs.run_id }}/shard-${{ matrix.shard }}.log
          retention-days: 30

  rollup:
    needs: [prep, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-[0-9]
          path: results/${{ needs.prep.outputs.run_id }}
      - name: Roll up
        run: |
          ls -R results | head -40
          python3 -I runner/rollup.py results/${{ needs.prep.outputs.run_id }}/shard-*/ \
            --out results/${{ needs.prep.outputs.run_id }} --run-id "${{ needs.prep.outputs.run_id }}" --pod runner/benchmark-pod.json
      - uses: actions/upload-artifact@v4
        with:
          name: rollup
          path: results/${{ needs.prep.outputs.run_id }}/rollup.json
      - name: Publish into demo-data
        if: ${{ inputs.publish }}
        run: |
          runner/publish.sh "results/${{ needs.prep.outputs.run_id }}" demo-data
          git config user.name "vibefish-runner"
          git config user.email "vibefish-runner@users.noreply.github.com"
          git add demo-data
          git commit -m "demo-data: ${{ needs.prep.outputs.run_id }} (${{ needs.prep.outputs.total }} games)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
