name: pages

# Deploys the dashboard plus demo-data/ to GitHub Pages from the testing branch (the live site shows
# what is being tested). The site is static: dashboard files at the root and the data under data/,
# which is the dashboard's default data location.
on:
  push:
    branches: [testing]
    paths:
      - "dashboard/**"
      - "demo-data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site/data
          cp dashboard/* site/
          if [ -d demo-data ]; then cp -r demo-data/. site/data/; fi
          find site -type f | head -50
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
