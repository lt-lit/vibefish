name: ab-run

# Paired A/B of per-deck AI data (playbook/precons/<deck>.json): for each deck, the same tables and seeds are played
# once per arm (stock, data, mc, mcdata, mcmax, mcmaxdata, playbook, playbookdata), sharded; the rollup job pairs them
# up per deck. Results are uploaded as artifacts (results/ab-<deck>/rollup.json); nothing is committed.
#
# Two ways to start a run: Run workflow (the inputs below), or a push to `testing` that changes
# runner/queue/ab-run.json, whose fields are the same inputs (a new "requested" value is enough to start the same
# run again). Runs on one branch queue behind each other; a promotion of `testing` to `main` starts nothing.
on:
  workflow_dispatch:
    inputs:
      decks:
        description: "Deck ids, comma-separated (ids from runner/precon-league.json); deck@variant plays playbook/variants/<deck>-<variant>.json"
        default: "token-triumph,goblin-storm,tricky-terrain,hail-caesar"
      games:
        description: "Tables per deck (each played once per arm)"
        default: "100"
      arms:
        description: "Arms, comma-separated: stock, data, mc, mcdata, mcmax, mcmaxdata, playbook, playbookdata (mcmax games take about three times longer)"
        default: "stock,data,mc,mcdata"
      shards_per_deck:
        description: "Shard jobs per deck (total jobs = decks x shards, max 20 at once)"
        default: "5"
      jobs_per_shard:
        description: "Games at a time per shard"
        default: "2"
      opponents:
        description: "Opponents at each table: 3 (four-player tables, the default) or 1 (duels: a faster read on combat, blind to table politics)"
        default: "3"
      seed:
        description: "Base seed (blank = today's date)"
        default: ""
      forge_channel:
        description: "Forge build: the pinned release, or the daily-snapshot build below"
        type: choice
        options: [pinned, snapshot]
        default: snapshot
      forge_snapshot_build:
        description: "Snapshot build to pin (FORGE_SNAPSHOT_BUILD); must be in forge/SHA256SUMS to be verified"
        default: "2.0.16-SNAPSHOT-11.08"
  push:
    branches: [testing]
    paths: [runner/queue/ab-run.json]

permissions:
  contents: read

concurrency:
  group: ab-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      decks: ${{ steps.vals.outputs.decks }}
      games: ${{ steps.vals.outputs.games }}
      arms: ${{ steps.vals.outputs.arms }}
      shards_per_deck: ${{ steps.vals.outputs.shards_per_deck }}
      jobs_per_shard: ${{ steps.vals.outputs.jobs_per_shard }}
      opponents: ${{ steps.vals.outputs.opponents }}
      seed: ${{ steps.vals.outputs.seed }}
      forge_channel: ${{ steps.vals.outputs.forge_channel }}
      snapshot_build: ${{ steps.vals.outputs.snapshot_build }}
      matrix: ${{ steps.vals.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: vals
        env:
          EVENT: ${{ github.event_name }}
          IN_DECKS: ${{ inputs.decks }}
          IN_GAMES: ${{ inputs.games }}
          IN_ARMS: ${{ inputs.arms }}
          IN_SHARDS_PER_DECK: ${{ inputs.shards_per_deck }}
          IN_JOBS_PER_SHARD: ${{ inputs.jobs_per_shard }}
          IN_OPPONENTS: ${{ inputs.opponents }}
          IN_SEED: ${{ inputs.seed }}
          IN_FORGE_CHANNEL: ${{ inputs.forge_channel }}
          IN_FORGE_SNAPSHOT_BUILD: ${{ inputs.forge_snapshot_build }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import datetime, json, os
          vals = {"decks": "token-triumph,goblin-storm,tricky-terrain,hail-caesar", "games": "100", "arms": "stock,data,mc,mcdata",
                  "shards_per_deck": "5", "jobs_per_shard": "2", "opponents": "3", "seed": "", "forge_channel": "snapshot",
                  "forge_snapshot_build": "2.0.16-SNAPSHOT-11.08"}
          if os.environ["EVENT"] == "push":
              queued = json.load(open("runner/queue/ab-run.json"))
              vals.update({k: str(v).strip() for k, v in queued.items() if k in vals})
          else:
              vals.update({k: os.environ["IN_" + k.upper()].strip() for k in vals if os.environ.get("IN_" + k.upper(), "").strip()})
          if not vals["seed"]:
              vals["seed"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d")
          decks = [d.strip() for d in vals["decks"].split(",") if d.strip()]
          for k, v in vals.items():
              print(f"{k}={v}")
          print("snapshot_build=" + (vals["forge_snapshot_build"] if vals["forge_channel"] == "snapshot" else ""))
          # "deck@variant" plays the deck with playbook/variants/<deck>-<variant>.json in place of its own file, so
          # several candidate playbooks can be measured side by side without any of them being the shipped one.
          matrix = []
          for entry in decks:
              deck, _, variant = entry.partition("@")
              data = f"playbook/variants/{deck}-{variant}.json" if variant else ""
              matrix += [{"entry": entry, "deck": deck, "data": data, "shard": k} for k in range(1, int(vals["shards_per_deck"]) + 1)]
          print("matrix=" + json.dumps(matrix))
          PY

  shard:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.matrix) }}
    env:
      FORGE_CHANNEL: ${{ needs.prep.outputs.forge_channel }}
      FORGE_SNAPSHOT_BUILD: ${{ needs.prep.outputs.snapshot_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Forge runtime
        uses: actions/cache@v4
        with:
          path: forge/runtime
          key: forge-runtime-${{ runner.os }}-${{ env.FORGE_CHANNEL }}-${{ env.FORGE_SNAPSHOT_BUILD }}-${{ hashFiles('forge/VERSION', 'forge/SHA256SUMS', 'forge/fetch-forge.sh') }}
      - run: forge/fetch-forge.sh
      - name: Arm profiles
        run: runner/make-arm-profiles.sh forge/runtime
      - name: Play ${{ matrix.entry }} shard ${{ matrix.shard }}
        run: |
          DATA=()
          if [ -n "${{ matrix.data }}" ]; then DATA=(--data "${{ matrix.data }}"); fi
          python3 -I runner/ab.py play --deck "${{ matrix.deck }}" --games "${{ needs.prep.outputs.games }}" --seed "${{ needs.prep.outputs.seed }}" \
            --out "results/ab-${{ matrix.entry }}" --runtime forge/runtime --arms "${{ needs.prep.outputs.arms }}" \
            --shards "${{ needs.prep.outputs.shards_per_deck }}" --shard "${{ matrix.shard }}" -j "${{ needs.prep.outputs.jobs_per_shard }}" \
            --opponents "${{ needs.prep.outputs.opponents }}" "${DATA[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-${{ matrix.entry }}-${{ matrix.shard }}
          path: |
            results/ab-${{ matrix.entry }}/arm-*/
            results/ab-${{ matrix.entry }}/ab.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-${{ matrix.entry }}-${{ matrix.shard }}-log
          path: results/ab-${{ matrix.entry }}/play.log
          retention-days: 30

  rollup:
    needs: [prep, shard]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ab-*
          merge-multiple: false
          path: artifacts
      - name: Roll up per deck
        run: |
          set -e
          mkdir -p results
          for d in $(echo "${{ needs.prep.outputs.decks }}" | tr ',' ' '); do
            mkdir -p "results/ab-$d"
            for a in artifacts/ab-$d-[0-9]*; do
              case "$a" in *-log) continue;; esac
              cp -rn "$a"/. "results/ab-$d"/
            done
            python3 -I runner/ab.py rollup "results/ab-$d"
          done
          ls results
      - uses: actions/upload-artifact@v4
        with:
          name: ab-rollups
          path: results/ab-*/rollup.json
